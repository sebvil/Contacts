# Dependencies of the included build-logic
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
detekt-gradlePlugin = { module = "dev.detekt:detekt-gradle-plugin", version.ref = "detekt" }
metro-gradlePlugin = { module = "dev.zacsweers.metro:gradle-plugin", version.ref = "metro" }


[bundles]
buildLogic = [
    "kotlin-gradlePlugin",
    "android-gradlePlugin",
    "detekt-gradlePlugin",
    "metro-gradlePlugin"
]
unitTests = [
    "testBalloon",
    "kotest-assertions"
]
ktorServer = [
    "ktor-server-contentNegotiation",
    "ktor-server-resources",
    "ktor-server-cors",
    "ktor-serialization",
    "ktor-serverCore",
    "ktor-serverNetty",
    "ktor-server-yamlConfig"
]

ktorClient = [
    "ktor-client-resources",
    "ktor-client-contentNegotiation",
    "ktor-serialization",
    "ktor-client-cio"
]
exposed = [
    "exposed-core",
    "exposed-r2dbc",
    "postgreSql"
]

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
