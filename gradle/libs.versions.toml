testBalloon = { id = "de.infix.testBalloon", version.ref = "testBalloon" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }

# convention plugins
androidApp = { id = "androidApp" }
desktopApp = { id = "desktopApp" }
kmpComposeLibrary = { id = "kmpComposeLibrary" }
webApp = { id = "webApp" }
