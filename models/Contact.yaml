name: Contact
description: Represents information for a contact.
properties:
  - name: id
    description: Unique identifier.
    schema:
      type: uuid
      isPrimaryKey: true
  - name: name
    description: Name of the contact.
    schema:
      type: string
  - name: birthday
    description: Contact's birthday.
    schema:
      type: date
      isNullable: true