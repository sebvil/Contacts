info:
  name: Create contact
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/contacts"
  body:
    type: json
    data: |-
      {
        "id": "{{$randomUUID}}"
        "name": "Elliot",
        "emailAddresses": [
          {
            "address": "elliot@fsociety.org",
            "label": "Work"
          },
          {
            "address": "elliot@example.com",
            "label": "Personal"
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
