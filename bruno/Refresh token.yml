info:
  name: Refresh token
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/refresh"
  body:
    type: json
    data: |-
      {
        "refreshToken": "token: send a login or register request to obtain it"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
